<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldradar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="600" height="120" fill="#0d1117" rx="10"/>
  <!-- Radar Crosshair / Scan Vector Glyph -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="70" height="70" fill="none" stroke="url(#emeraldradar)" stroke-width="2" rx="8"/>
    <!-- Radar concentric circles -->
    <circle cx="35" cy="35" r="24" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="35" cy="35" r="14" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="3" fill="#34d399"/>
    <!-- Crosshairs -->
    <line x1="35" y1="8" x2="35" y2="62" stroke="#065f46" stroke-width="1"/>
    <line x1="8" y1="35" x2="62" y2="35" stroke="#065f46" stroke-width="1"/>
    <!-- Radar sweep angle -->
    <line x1="35" y1="35" x2="52" y2="18" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Typography -->
  <text x="125" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="1">AETHERSCAN</text>
  <text x="127" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5">FIREFOX NATIVE MESSAGING NMAP DIAGNOSTIC SUITE</text>
  <line x1="125" y1="92" x2="570" y2="92" stroke="#21262d" stroke-width="1.5"/>
</svg>
